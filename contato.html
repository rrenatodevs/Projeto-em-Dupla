<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Expatriados de Sofá</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
<header>
  <nav class="navbar navbar-expand-lg navbar-dark" aria-label="Navegação principal">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        <img src="img/nav-logo.png" alt="Expatriados de Sofá, página inicial" class="d-inline-block align-text-top"> Expatriados de Sofá</a>
      <div class="d-flex align-items-center gap-2 ms-auto order-lg-last">
        <button class="btn btn-tema" type="button" aria-label="Alternar tema claro e escuro">
          <img src="img/nav-dark.png" alt="">
        </button>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir ou fechar menu">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="transparencia.html">Transparência</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="contato.html" aria-current="page">Contato</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<main class="container my-5">
  <section class="row justify-content-center mb-5">
    <div class="col-lg-8">
      <span class="badge mb-2 px-3 py-2">Fale Conosco</span>
      <h1 class="fw-bold mb-3">Entre em Contato</h1>
      <p class="text-muted mb-4">Tem alguma dúvida, sugestão ou feedback sobre o projeto acadêmico "Expatriados de Sofá"? Envie uma mensagem para a nossa equipa.</p>
      
      <div class="card card-dado p-4 shadow-sm border-0">
        <div class="card-body">
          <form onsubmit="event.preventDefault(); alert('Mensagem enviada com sucesso! Obrigado pelo contato.');">
            <div class="mb-3">
              <label for="nome" class="form-label fw-bold">Nome completo</label>
              <input type="text" class="form-control" id="nome" placeholder="Digite o seu nome..." required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label fw-bold">E-mail</label>
              <input type="email" class="form-control" id="email" placeholder="seu.email@exemplo.com" required>
            </div>
            <div class="mb-3">
              <label for="mensagem" class="form-label fw-bold">Mensagem</label>
              <textarea class="form-control" id="mensagem" rows="4" placeholder="Escreva aqui a sua mensagem ou sugestão..." required></textarea>
            </div>
            <button type="submit" class="btn hero-btn-primario w-100 py-2">Enviar Mensagem</button>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="js/app.js"></script>
</body>
</html>
